{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
            <p class="text-sm font-semibold text-blue-600 uppercase tracking-wide">Administration</p>
            <h1 class="text-3xl font-bold text-slate-900">User Management</h1>
            <p class="text-sm text-slate-600">Officer-only: add or remove users.</p>
        </div>
    </div>

    <div class="bg-white p-6 rounded-xl shadow border border-slate-100">
        <h2 class="text-lg font-semibold mb-4">Add User</h2>
        <form action="/users/add" method="POST" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <input type="text" name="username" placeholder="Username" required class="w-full border border-slate-200 p-3 rounded-lg">
            <input type="password" name="password" placeholder="Password" required class="w-full border border-slate-200 p-3 rounded-lg">
            <select name="role" class="w-full border border-slate-200 p-3 rounded-lg">
                <option value="tutor">Tutor</option>
                <option value="wellbeing_officer">Wellbeing Officer</option>
                <option value="module_leader">Module Leader</option>
            </select>
            <button type="submit" class="md:col-span-3 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 shadow">Add User</button>
        </form>
    </div>

    <div class="bg-white rounded-xl shadow border border-slate-100 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
            <h3 class="text-lg font-semibold">Existing Users</h3>
        </div>
        <div class="overflow-x-auto">
            <table class="min-w-full">
                <thead class="bg-slate-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">Username</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">Role</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-slate-100">
                    {% for u in users %}
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-3 whitespace-nowrap">{{ u.id }}</td>
                        <td class="px-6 py-3 whitespace-nowrap font-medium">{{ u.username }}</td>
                        <td class="px-6 py-3 whitespace-nowrap text-slate-600">{{ u.role }}</td>
                        <td class="px-6 py-3 whitespace-nowrap text-sm font-medium space-y-2">
                            <form action="/users/update/{{ u.id }}" method="POST" class="flex flex-col md:flex-row md:items-center gap-2">
                                <select name="role" class="border border-slate-200 p-2 rounded text-xs">
                                    <option value="tutor" {% if u.role == 'tutor' %}selected{% endif %}>Tutor</option>
                                    <option value="wellbeing_officer" {% if u.role == 'wellbeing_officer' %}selected{% endif %}>Wellbeing Officer</option>
                                    <option value="module_leader" {% if u.role == 'module_leader' %}selected{% endif %}>Module Leader</option>
                                </select>
                                <input type="password" name="password" placeholder="New password (optional)" class="border border-slate-200 p-2 rounded text-xs flex-1">
                                <button type="submit" class="text-blue-600 hover:text-blue-800 text-xs">Update</button>
                            </form>
                            <form action="/users/delete/{{ u.id }}" method="POST" onsubmit="return confirm('Delete user?');">
                                <button type="submit" class="text-red-600 hover:text-red-800 text-xs">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="px-6 py-4 text-center text-slate-500">No users found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
