{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white shadow-xl rounded-xl p-8 border border-slate-100">
        <div class="text-center mb-6">
            <p class="text-sm font-semibold text-blue-600 uppercase tracking-wide">Secure Access</p>
            <h2 class="text-2xl font-bold text-slate-900">Sign in to WellbeingSys</h2>
            <p class="text-sm text-slate-600 mt-1">Use your officer or tutor credentials.</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-slate-700 text-sm font-semibold mb-1">Username</label>
                <input type="text" name="username" class="w-full border border-slate-200 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
            </div>
            <div>
                <label class="block text-slate-700 text-sm font-semibold mb-1">Password</label>
                <input type="password" name="password" class="w-full border border-slate-200 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow hover:bg-blue-700 transition">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
