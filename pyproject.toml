[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[project]
name = "student-wellbeing-insights"
version = "0.1.0"
description = "Flask-based wellbeing insights prototype"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "flask_login",
    "pydantic",
]

[tool.setuptools]
packages = ["app"]
